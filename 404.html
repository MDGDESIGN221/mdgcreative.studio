  .btn-s{background:transparent;color:#f0ede8;border:1px solid rgba(255,255,255,.22)}

<style id="mdg-transition">
/* Voile d'arrivee. La page se decouvre depuis sa propre couleur de fond,
   celle vers laquelle la page precedente a fondu : le raccord se fait
   sur une couleur commune, pas sur un noir arbitraire. */
.mdg-arrivee{position:fixed;inset:0;z-index:100000;background:#060606;pointer-events:none;animation:mdg-lever .42s cubic-bezier(.4,0,.2,1) forwards}
@keyframes mdg-lever{to{opacity:0;visibility:hidden}}
/* Un fondu ne deplace rien : il reste admis sous mouvement reduit,
   simplement plus court. */
@media(prefers-reduced-motion:reduce){.mdg-arrivee{animation-duration:.2s}}
</style>

<script id="mdg-404-lang">
(function(){
  /* L'URL demandee prime sur la langue du navigateur : un visiteur qui
     se perd sous /en/ attend une page anglaise, meme si son navigateur
     est en francais. */
  var sousEn = /^\/en(\/|$)/.test(location.pathname);
  var nav = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  if (!sousEn && nav === 'fr') return;

  document.documentElement.lang = 'en';
  var t = {
    '.eyebrow': 'Error 404',
    'h1': 'This page has moved.',
    'p': 'The link you followed does not exist, or no longer does. No worries · everything that matters is still in place.',
    '.btn-p': '← Back to home',
    '.btn-s': 'Get in touch'
  };
  Object.keys(t).forEach(function(sel){
    var e = document.querySelector(sel);
    if (e) e.textContent = t[sel];
  });
  var accueil = document.querySelector('.btn-p');
  if (accueil && sousEn) accueil.setAttribute('href', '/en/');
})();
</script>
